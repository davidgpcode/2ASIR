interfaces {
    ethernet eth0 {
        address "dhcp"
        hw-id "0c:81:7e:36:00:00"
    }
    ethernet eth1 {
        hw-id "0c:81:7e:36:00:01"
    }
    ethernet eth2 {
        hw-id "0c:81:7e:36:00:02"
    }
    ethernet eth3 {
        hw-id "0c:81:7e:36:00:03"
    }
    ethernet eth4 {
        hw-id "0c:81:7e:36:00:04"
    }
    loopback lo {
    }
}
service {
    ntp {
        allow-client {
            address "127.0.0.0/8"
            address "169.254.0.0/16"
            address "10.0.0.0/8"
            address "172.16.0.0/12"
            address "192.168.0.0/16"
            address "::1/128"
            address "fe80::/10"
            address "fc00::/7"
        }
        server time1.vyos.net {
        }
        server time2.vyos.net {
        }
        server time3.vyos.net {
        }
    }
    ssh {
    }
}
system {
    config-management {
        commit-revisions "100"
    }
    console {
        device ttyS0 {
            kernel
            speed "115200"
        }
    }
    host-name "vyos"
    login {
        operator-group default {
            command-policy {
                allow "*"
            }
        }
        user respaldo {
            authentication {
                public-keys pc {
                    key "AAAAC3NzaC1lZDI1NTE5AAAAIE4dIRwbM9ByvfKR+R4Vbx4vYVuHY1NOiqgmuelnAiQN"
                    type "ssh-ed25519"
                }
            }
        }
        user vyos {
            authentication {
                encrypted-password "<OCULTO>"
                plaintext-password ""
            }
        }
    }
    option {
        reboot-on-upgrade-failure "5"
    }
    syslog {
        local {
            facility all {
                level "info"
            }
            facility local7 {
                level "debug"
            }
        }
    }
}


